<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../css/style.css" />
		<script src="../js/carrinho.js" defer></script>
		<script src="../js/navbar.js" defer></script>
		<script src="../js/login.js" defer></script>
		<title>Entrar | E-comerce</title>
	</head>

	<body>
		<header>
			<nav id="logo">
				<a href="#"></a>
			</nav>

			<nav id="users">
				<a href="./perfil.html" class="icon-user" aria-label="Acessar perfil"></a>
				<a id="carrinho" class="icon-bag" aria-label="Acessar carrinho"></a>
			</nav>
		</header>
		<main>
			<section class="pagina-login">
				<form class="form-login" novalidate>
					<h1 class="login-titulo">Entrar</h1>

					<label class="login-campo">
						<span>E-mail</span>
						<input type="email" name="email" autocomplete="email" required />
					</label>

					<label class="login-campo">
						<span>Senha</span>
						<input type="password" name="senha" autocomplete="current-password" required />
					</label>

					<p class="login-aviso" role="alert" hidden></p>

					<button type="submit" class="btn-login">Entrar</button>

					<p class="login-troca">
						Não tem conta? <a class="link-troca" href="./cadastro.html">Criar conta</a>
					</p>
				</form>

				<!-- 2ª etapa, só para admin: o código que chegou por e-mail -->
				<form class="form-login form-codigo" novalidate hidden>
					<h1 class="login-titulo">Verificação</h1>
					<p class="codigo-instrucao">
						Enviamos um código de 6 números para <strong class="codigo-email"></strong>.
						Ele vale por 10 minutos.
					</p>

					<label class="login-campo">
						<span>Código</span>
						<input
							type="text"
							name="codigo"
							class="campo-codigo"
							inputmode="numeric"
							autocomplete="one-time-code"
							pattern="[0-9]{6}"
							maxlength="6"
							placeholder="000000"
							required
						/>
					</label>

					<p class="login-aviso codigo-aviso" role="alert" hidden></p>

					<button type="submit" class="btn-login">Confirmar</button>

					<div class="codigo-acoes">
						<button type="button" class="btn-link btn-reenviar" disabled>Reenviar código</button>
						<button type="button" class="btn-link btn-voltar-login">Usar outra conta</button>
					</div>
				</form>
			</section>
		</main>
		<footer>
			<nav class="nav-bar">
				<a href="../index.html">Inicio</a>
				<a href="./produtos.html">Produtos</a>
				<a href="./galeria.html">Galeria</a>
				<a href="./contato.html">Politicas de contato</a>
				<a href="./sobre.html">Sobre</a>
			</nav>
		</footer>
	</body>
</html>
